server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|webp|avif|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # No servir archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }
}
