server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # El resto de cabeceras de seguridad las pone el proxy (Caddy).
    # La CSP va aquí porque depende de los hashes generados en el build.

    # Assets con hash en el nombre: inmutables.
    location /assets/ {
        include /etc/nginx/csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Páginas pre-renderizadas; rutas desconocidas -> SPA fallback con estado 404.
    location / {
        include /etc/nginx/csp.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /__spa-fallback.html;
    location = /__spa-fallback.html {
        include /etc/nginx/csp.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }

    # Archivos ocultos (.git, .env, ...): denegar.
    location ~ /\. {
        deny all;
    }
}
