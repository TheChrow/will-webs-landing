# Overlay de desarrollo: hot reload, contraseñas desde .env, puertos solo en 127.0.0.1.
services:
  proxy:
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:80"

  frontend:
    build:
      target: dev
    read_only: false
    environment:
      VITE_USE_POLLING: "1"
      VITE_HMR_CLIENT_PORT: ${HTTP_PORT:-8088}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    volumes:
      - ./frontend:/app
      # node_modules del contenedor (Linux), no los del host.
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      target: dev
    read_only: false
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?define APP_DB_PASSWORD en .env}
      # Vacío = captcha desactivado (solo dev). Para probar Turnstile usa sus claves de test.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${API_PORT_LOCAL:-8001}:8000"

  migrate:
    build:
      target: dev
    environment:
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?define MIGRATOR_DB_PASSWORD en .env}
    volumes:
      - ./backend:/app

  db:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      CREATE_TEST_DB: "1"
    ports:
      - "127.0.0.1:${DB_PORT_LOCAL:-3307}:3306"

  # SMTP falso para probar correos: UI en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]

volumes:
  frontend_node_modules:
